[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-openaichat"
version = "2.4.2"
description = "Autourgos LLM wrapper for the OpenAI Chat Completions API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com" },
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = [
    "autourgos", "openai", "llm", "chat", "completions",
    "ai", "agent", "wrapper", "gpt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pydantic>=2.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-openaichat"
Repository = "https://github.com/devxjitin/autourgos-openaichat"
Issues = "https://github.com/devxjitin/autourgos-openaichat/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_openaichat*"]

[tool.setuptools.package-data]
autourgos_openaichat = ["py.typed"]
